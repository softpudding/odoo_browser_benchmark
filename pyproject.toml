[project]
name = "odoo-benchmark"
version = "0.1.0"
description = "Odoo Backend-Grounded Browser Agent Benchmark"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.58.0",
    "pyyaml>=6.0",
]

[project.scripts]
benchmark-eval = "benchmark.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

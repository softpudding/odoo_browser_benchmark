task_id: crm.duplicate_lead_convert_to_opportunity
module: crm
difficulty: medium
instruction: see prompt.md
start_url: /odoo/crm
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
  setup_script: seed.py
time_limit_sec: 600
step_limit: 200
metadata:
  category: deep_ui_interaction
  difficulty_level: medium
  agent_interaction: "Open a seeded lead, use the cog/Actions menu to Duplicate it, rename the copy, quick-create a partner, and click the header 'Convert to Opportunity' button which opens a wizard that requires selecting 'Create a new customer' and applying."
  checks_verify: "Original lead 'Bench Template Lead' still exists as type=lead; new crm.lead 'Bench Cloned Opp' exists with type='opportunity' and partner_id set to 'Bench Cloned Customer'."
  failure_pattern: "Agent either (a) can't find Duplicate in the cog Actions menu, (b) fails the Convert-to-Opportunity wizard (action radio 'Create a new customer' vs 'Link to existing'), or (c) edits the original lead in place instead of duplicating it first."
  primary_track: true
  tier: 2

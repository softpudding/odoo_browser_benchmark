models:
  slide.channel:
    match_key:
      - name
    fields:
      - name
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
  slide.slide:
    match_key:
      - name
    fields:
      - name
      - channel_id
      - slide_category
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
  slide.question:
    match_key:
      - question
    fields:
      - question
      - slide_id
    ignore_fields:
      - id
      - create_date
      - write_date
  slide.answer:
    match_key:
      - text_value
    fields:
      - text_value
      - question_id
      - is_correct
    ignore_fields:
      - id
      - create_date
      - write_date

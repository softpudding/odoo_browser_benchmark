models:
  crm.lead:
    match_key:
      - name
      - email_from
    fields:
      - name
      - email_from
      - type
      - stage_id
      - expected_revenue
      - probability
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_last_stage_update
      - message_ids
      - message_follower_ids
      - activity_ids

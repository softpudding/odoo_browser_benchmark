models:
  sale.order:
    match_key:
      - partner_id
      - client_order_ref
    fields:
      - partner_id
      - client_order_ref
      - amount_untaxed
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
  sale.order.line:
    match_key:
      - order_id
      - product_id
    fields:
      - product_id
      - product_uom_qty
      - price_unit
    ignore_fields:
      - id
      - create_date
      - write_date

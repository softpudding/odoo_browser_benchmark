# Trace oracle for sale.exact_total_quotation
#
# WRITE POLICY: strict allowlist. Any write not listed in required_ops
# or optional_ops is an unauthorized write and fails StrictSuccess.
#
# The agent creates a new quotation and adds products to hit exactly $1000.
# It should save but NOT confirm.

required_ops:
  - sale.order.onchange       # triggered when adding lines / changing values

optional_ops:
  # --- Reads ---
  - sale.order.read
  - sale.order.web_read
  - sale.order.search_read
  - sale.order.web_search_read
  - sale.order.name_search
  - sale.order.line.read
  - sale.order.line.search_read
  - sale.order.line.onchange
  - product.product.name_search
  - product.product.read
  - product.product.search_read
  - product.template.read
  - product.template.search_read
  - res.partner.search_read
  - res.partner.name_search
  - res.partner.read
  - account.tax.read
  - ir.ui.view.get_views
  - ir.ui.view.read
  - ir.model.data.search_read
  # --- Writes that are part of normal SO creation flow ---
  - sale.order.create          # creating the quotation
  - sale.order.write           # saving changes to the quotation
  - sale.order.line.create     # adding order lines
  - sale.order.line.write      # modifying order lines (qty, price)
  - sale.order.web_save        # save via web client
  - sale.order.line.web_save   # save via web client
  - mail.message.create        # chatter auto-messages
  - mail.followers.create      # auto-follow
  - bus.bus.create             # notification bus
  # --- Partner/product search writes triggered by autocomplete ---
  - res.partner.web_name_search
  - res.partner.autocomplete_by_name
  - product.template.web_name_search
  - product.template.get_single_product_variant
  - product.product.web_name_search

forbidden_ops:
  - sale.order.action_confirm  # must NOT confirm, only save
  - sale.order.unlink          # should not delete quotations
  - sale.order.action_cancel   # should not cancel anything
  - sale.order.line.unlink     # should not delete lines (add correctly first time)

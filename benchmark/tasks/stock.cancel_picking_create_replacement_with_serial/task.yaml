task_id: stock.cancel_picking_create_replacement_with_serial
module: stock
difficulty: hard
instruction: see prompt.md
start_url: /odoo/inventory
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
setup_script: seed.py
time_limit_sec: 600
step_limit: 300
metadata:
  category: recovery_rollback
  difficulty_level: hard
  agent_interaction: "Open a ready receipt for a mistaken item, Cancel it via the header, then create a brand-new receipt for the same vendor with a different serial-tracked product, qty=2, entering two distinct serial numbers (one per move_line) via the Detailed Operations popup, and Validate."
  checks_verify: "Original receipt R-BENCH-CANCEL-001 state='cancel'; a new receipt exists for the same vendor with state='done' carrying 2 stock.move.line rows whose lot_ids are stock.lot records named 'BS-001' and 'BS-002' on product 'Bench Serial Widget'."
  failure_pattern: "Agent either skips the Cancel on the original picking (leaving it in 'ready'/'assigned') or, on the replacement receipt, enters only the first serial (BS-001) and validates with a single move_line of qty=2 instead of adding a second row for BS-002."
  primary_track: true
  tier: 3

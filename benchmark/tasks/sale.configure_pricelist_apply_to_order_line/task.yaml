task_id: sale.configure_pricelist_apply_to_order_line
module: sale
difficulty: hard
instruction: see prompt.md
start_url: /odoo/sales
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
setup_script: seed.py
time_limit_sec: 600
step_limit: 300
metadata:
  category: deep_ui_interaction
  difficulty_level: hard
  agent_interaction: "Create a new product.pricelist named 'Bench 10% Off' with one rule (apply on All Products, Price Type = Formula, 10% discount on sales price) via Sales > Products > Pricelists > New. Then create a new sale.order for 'Bench Price Co', pick 'Bench 10% Off' as the pricelist, add 1x 'Bench Price Item' (list_price 200) so the pricelist-driven onchange computes price_unit=180. Save as draft quotation."
  checks_verify: "product.pricelist 'Bench 10% Off' exists with >=1 item (price_discount=10, compute_price=formula, applied_on=3_global). sale.order for 'Bench Price Co' with pricelist_id=Bench 10% Off has one line Bench Price Item qty=1 price_unit=180.00, state=draft."
  failure_pattern: "Agent often types the discount into the wrong sub-section (percentage vs formula) of the pricelist rule form, leaves compute_price='fixed' (the default), or manually overwrites the pricelist-driven unit price on the SO line instead of letting the onchange compute 180.00."
  primary_track: true
  tier: 3

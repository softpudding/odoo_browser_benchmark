models:
  sale.order:
    match_key:
      - client_order_ref
    fields:
      - client_order_ref
      - partner_id
      - state
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - date_order
  purchase.order:
    match_key:
      - partner_id
    fields:
      - partner_id
      - state
    ignore_fields:
      - id
      - name
      - origin
      - create_date
      - write_date
      - date_order
      - date_approve
  stock.picking:
    match_key:
      - partner_id
    fields:
      - partner_id
      - state
    ignore_fields:
      - id
      - name
      - origin
      - create_date
      - write_date
      - date_done
      - scheduled_date

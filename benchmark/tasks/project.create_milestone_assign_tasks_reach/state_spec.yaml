models:
  project.milestone:
    match_key:
      - project_id
      - name
    fields:
      - project_id
      - name
      - deadline
      - is_reached
    ignore_fields:
      - id
      - create_date
      - write_date
      - reached_date
      - __last_update

  project.task:
    match_key:
      - project_id
      - name
    fields:
      - project_id
      - name
      - milestone_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_last_stage_update
      - stage_id
      - __last_update

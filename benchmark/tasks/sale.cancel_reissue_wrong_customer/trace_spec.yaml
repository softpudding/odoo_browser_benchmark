# Trace oracle for sale.cancel_reissue_wrong_customer
#
# Category 4: Recovery and rollback.
# Agent must cancel the wrong sales order and confirm the replacement.

required_ops:
  - sale.order.action_cancel
  - sale.order.action_confirm

optional_ops:
  - sale.order.create
  - sale.order.read
  - sale.order.web_read
  - sale.order.search_read
  - sale.order.web_search_read
  - sale.order.write
  - sale.order.web_save
  - sale.order.line.create
  - sale.order.line.read
  - sale.order.line.search_read
  - sale.order.line.write
  - sale.order.line.onchange
  - product.product.read
  - product.product.search_read
  - res.partner.read
  - res.partner.search_read
  - ir.ui.view.get_views
  - ir.ui.view.read
  - mail.message.create
  - mail.followers.create
  - bus.bus.create

forbidden_ops:
  - sale.order.unlink

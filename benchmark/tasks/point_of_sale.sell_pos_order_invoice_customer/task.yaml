task_id: point_of_sale.sell_pos_order_invoice_customer
module: point_of_sale
difficulty: hard
instruction: see prompt.md
start_url: /odoo/point-of-sale
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
  setup_script: seed.py
time_limit_sec: 480
step_limit: 300
metadata:
  category: closed_loop_cross_module
  difficulty_level: hard
  agent_interaction: "Open POS register, add 1 unit of the seeded product, click Customer and select the seeded partner, go to Payment, enable the Invoice toggle on the payment screen (a non-default option that browser-use rarely triggers), pay the cash amount, and validate. The Invoice toggle must be active at validation time so Odoo creates a posted account.move."
  checks_verify: "POS order has partner_id=Invoice Iris, state in {paid, done, invoiced}, to_invoice=True, account_move is set and posted, account.move type=out_invoice with partner=Invoice Iris and amount_total=50.0; cash payment of 50.0 exists; the seeded session is still open."
  failure_pattern: "Agent rings up the sale and pays cash but never enables the Invoice toggle on the payment screen, so to_invoice stays False and no account.move is created — the most natural left-to-right flow on the POS payment screen skips the toggle entirely."
  primary_track: true
  tier: 3

models:
  slide.channel:
    match_key:
      - name
    fields:
      - name
      - website_published
      - visibility
      - enroll
    ignore_fields:
      - id
      - create_date
      - write_date
  slide.slide:
    match_key:
      - name
    fields:
      - name
      - channel_id
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - html_content

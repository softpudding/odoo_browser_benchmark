# Trace oracle for hr_recruitment.refuse_duplicate_applications
#
# Category 2: Policy trap (wizard).
# Agent must use the refusal wizard, enable duplicate handling, and edit the
# outgoing email before confirming.

required_ops:
  - applicant.get.refuse.reason.action_refuse_reason_apply

optional_ops:
  - hr.applicant.read
  - hr.applicant.search_read
  - hr.applicant.web_search_read
  - hr.applicant.write
  - applicant.get.refuse.reason.create
  - applicant.get.refuse.reason.read
  - applicant.get.refuse.reason.write
  - applicant.get.refuse.reason.web_save
  - applicant.get.refuse.reason.onchange
  - hr.applicant.refuse.reason.read
  - hr.applicant.refuse.reason.search_read
  - mail.template.read
  - mail.message.create
  - mail.followers.create
  - ir.ui.view.get_views
  - ir.ui.view.read
  - bus.bus.create

forbidden_ops:
  - hr.applicant.unlink

models:
  mrp.production:
    match_key:
      - name
    fields:
      - name
      - state
      - product_qty
      - qty_produced
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_start
      - date_finished
      - date_deadline
      - date_planned_start
      - date_planned_finished
  mrp.workorder:
    match_key:
      - production_id
      - workcenter_id
    fields:
      - state
      - qty_produced
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_start
      - date_finished
      - leave_id
      - duration
      - duration_expected

models:
  slide.channel:
    match_key:
      - name
    fields:
      - name
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
  slide.slide:
    match_key:
      - name
    fields:
      - name
      - channel_id
      - slide_category
      - is_category
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - sequence
      - category_id
      - completion_time

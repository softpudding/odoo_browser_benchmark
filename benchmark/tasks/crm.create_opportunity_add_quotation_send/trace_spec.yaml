# Trace oracle for crm.create_opportunity_add_quotation_send
#
# Hard: Create CRM opportunity, use "New Quotation" to create linked SO
# with exact lines, then send by email via compose wizard.

required_ops:
  - crm.lead.web_save                     # save the opportunity
  - sale.order.action_quotation_send       # triggers the email compose wizard

optional_ops:
  - crm.lead.create
  - crm.lead.read
  - crm.lead.write
  - crm.lead.search_read
  - crm.lead.web_search_read
  - crm.lead.web_read
  - sale.order.create
  - sale.order.read
  - sale.order.web_read
  - sale.order.write
  - sale.order.web_save
  - sale.order.onchange
  - sale.order.search_read
  - sale.order.web_search_read
  - sale.order.line.create
  - sale.order.line.read
  - sale.order.line.write
  - sale.order.line.onchange
  - mail.compose.message.create
  - mail.compose.message.action_send_mail
  - mail.template.read
  - product.product.read
  - product.product.search_read
  - product.product.web_search_read
  - res.partner.read
  - res.partner.search_read
  - res.partner.web_search_read
  - ir.ui.view.get_views
  - ir.ui.view.read
  - mail.message.create
  - mail.followers.create
  - crm.stage.search_read
  - crm.stage.web_search_read

forbidden_ops:
  - sale.order.action_confirm       # must NOT confirm the quotation
  - sale.order.unlink
  - sale.order.action_cancel
  - crm.lead.unlink
  - crm.lead.action_set_lost
  - crm.lead.action_archive

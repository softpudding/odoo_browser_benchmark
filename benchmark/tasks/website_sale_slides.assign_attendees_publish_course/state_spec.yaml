models:
  slide.channel:
    match_key:
      - name
    fields:
      - name
      - visibility
      - enroll
      - is_published
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - message_ids
      - message_follower_ids
      - activity_ids
      - __last_update
      - prerequisite_channel_ids
      - prerequisite_of_channel_ids
      - access_token
  slide.channel.partner:
    match_key:
      - channel_id
      - partner_id
    fields:
      - channel_id
      - partner_id
      - member_status
    ignore_fields:
      - id
      - create_date
      - write_date
      - last_invitation_date
      - completion
      - completed_slides_count

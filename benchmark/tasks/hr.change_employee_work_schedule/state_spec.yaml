models:
  hr.employee:
    match_key:
      - name
    fields:
      - name
      - job_title
      - job_id
      - work_email
      - resource_calendar_id
      - active
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - message_ids
      - activity_ids
      - display_name

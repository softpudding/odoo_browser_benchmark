models:
  event.event:
    match_key:
      - name
    fields:
      - name
      - is_published
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - create_uid
      - write_uid
      - message_ids
      - activity_ids
      - event_ticket_ids
      - event_slot_ids
      - question_ids
      - general_question_ids
      - specific_question_ids
      - seats_available
      - seats_used
      - seats_taken
      - seats_expected
      - seats_reserved
      - seats_unconfirmed
      - published_date
      - website_url
      - menu_id
      - introduction_menu_ids
      - community_menu_ids
      - register_menu_ids
      - date_begin
      - date_end
      - stage_id
      - kanban_state
      - date_tz
      - start_sale_datetime

  event.question:
    match_key:
      - title
    fields:
      - title
      - question_type
      - is_mandatory_answer
      - once_per_order
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - create_uid
      - write_uid
      - event_ids
      - event_type_ids
      - answer_ids
      - sequence
      - is_default
      - is_reusable
      - event_count
      - active

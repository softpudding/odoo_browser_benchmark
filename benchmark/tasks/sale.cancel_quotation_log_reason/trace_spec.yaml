# Trace oracle for sale.cancel_quotation_log_reason
#
# Medium: post log note then cancel a draft quotation.

required_ops:
  - sale.order.action_cancel

optional_ops:
  - sale.order.read
  - sale.order.write
  - sale.order.web_save
  - sale.order.search_read
  - sale.order.web_search_read
  - mail.message.create
  - mail.thread.message_post
  - ir.ui.view.get_views

forbidden_ops:
  - sale.order.unlink
  - sale.order.action_confirm

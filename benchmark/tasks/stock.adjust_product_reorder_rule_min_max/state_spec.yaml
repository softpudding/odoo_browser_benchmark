models:
  stock.warehouse.orderpoint:
    match_key:
      - product_id
    fields:
      - product_id
      - product_min_qty
      - product_max_qty
      - location_id
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - snoozed_until
      - qty_to_order
      - qty_to_order_manual
      - qty_on_hand
      - qty_forecast

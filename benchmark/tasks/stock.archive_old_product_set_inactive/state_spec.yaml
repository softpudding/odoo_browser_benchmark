models:
  product.template:
    match_key:
      - name
    fields:
      - name
      - active
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - message_ids
      - activity_ids
      - display_name
  product.product:
    match_key:
      - default_code
    fields:
      - default_code
      - active
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - message_ids
      - activity_ids
      - display_name

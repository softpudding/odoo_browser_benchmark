models:
  forum.post:
    match_key:
      - name
      - parent_id
      - create_uid
    fields:
      - name
      - parent_id
      - forum_id
      - is_correct
      - state
      - create_uid
    ignore_fields:
      - id
      - create_date
      - write_date
      - content
      - plain_content
      - relevancy
      - vote_count
      - favourite_count
      - last_activity_date
      - website_url
      - child_count
      - has_validated_answer
      - self_reply
      - tag_ids
      - vote_ids
      - favourite_ids
      - child_ids
      - website_message_ids
      - message_ids
      - message_follower_ids
      - activity_ids
      - website_meta_title
      - website_meta_description
      - website_meta_keywords
      - website_meta_og_img
      - is_seo_optimized
      - karma_accept
      - karma_edit
      - karma_close
      - karma_unlink
      - karma_comment
      - karma_comment_convert
      - karma_flag
      - user_vote
      - uid_has_answered
      - can_accept
      - can_ask
      - can_answer
      - can_edit
      - can_close
      - can_unlink
      - can_upvote
      - can_downvote
      - can_comment
      - can_comment_convert
      - can_post
      - can_flag
      - can_moderate
      - can_use_full_editor
      - can_view
      - can_display_biography
  forum.post.vote:
    match_key:
      - post_id
      - user_id
      - vote
    fields:
      - post_id
      - user_id
      - vote
      - forum_id
      - recipient_id
    ignore_fields:
      - id
      - create_date
      - write_date

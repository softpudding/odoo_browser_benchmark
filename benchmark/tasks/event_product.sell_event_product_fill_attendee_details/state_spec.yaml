models:
  sale.order:
    match_key:
      - partner_id
    fields:
      - partner_id
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - name
      - date_order
  event.registration:
    match_key:
      - event_id
      - partner_id
    fields:
      - event_id
      - partner_id
      - name
      - email
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - barcode

models:
  hr.attendance:
    match_key:
      - employee_id
    fields:
      - employee_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - worked_hours
      - check_in
      - check_out
      - check_in_outside_calendar_hours
      - check_out_outside_calendar_hours
      - last_check_in
      - expected_hours
      - validated_overtime_hours

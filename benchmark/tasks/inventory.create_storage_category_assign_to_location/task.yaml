task_id: inventory.create_storage_category_assign_to_location
module: stock
difficulty: medium
instruction: see prompt.md
start_url: /odoo/inventory
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
setup_script: seed.py
time_limit_sec: 360
step_limit: 200
metadata:
  category: deep_ui_interaction
  difficulty_level: medium
  tier: 2
  agent_interaction: "Open Inventory Settings and enable the 'Storage Locations' toggle (which exposes Storage Categories in v19), Save the settings (page reloads), then go to Configuration → Storage Categories, create a new 'Cold Chain' category with Max Weight = 500 (kg), save. Then open Configuration → Locations, click WH/Stock, set Storage Category = 'Cold Chain' and save."
  checks_verify: "stock.storage.category 'Cold Chain' exists with max_weight=500.0; stock.location 'WH/Stock' has storage_category_id pointing to Cold Chain; storage_categories feature group is enabled."
  failure_pattern: "Agent forgets the settings prerequisite (Storage Locations toggle) so the Storage Categories menu and the storage_category_id field on the location are both invisible; or it confuses the category/quantity fields on capacity rules with max_weight on the category itself."
  primary_track: true

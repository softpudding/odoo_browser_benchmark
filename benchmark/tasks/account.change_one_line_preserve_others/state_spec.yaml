models:
  account.move:
    match_key:
      - partner_id
      - ref
    fields:
      - partner_id
      - ref
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
  account.move.line:
    match_key:
      - move_id
      - product_id
    fields:
      - product_id
      - quantity
      - price_unit
      - discount
    ignore_fields:
      - id
      - create_date
      - write_date

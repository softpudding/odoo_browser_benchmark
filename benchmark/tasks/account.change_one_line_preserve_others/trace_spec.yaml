# Trace oracle for account.change_one_line_preserve_others
#
# Category 3: Side-effect trap.
# Agent must reset to draft, edit one line, re-post.

required_ops:
  - account.move.button_draft      # reset to draft
  - account.move.action_post       # re-post after edit

optional_ops:
  - account.move.read
  - account.move.web_read
  - account.move.search_read
  - account.move.web_search_read
  - account.move.write
  - account.move.web_save
  - account.move.onchange
  - account.move.line.read
  - account.move.line.search_read
  - account.move.line.write
  - account.move.line.onchange
  - product.product.read
  - res.partner.read
  - res.partner.search_read
  - ir.ui.view.get_views
  - ir.ui.view.read
  - account.tax.read
  - mail.message.create
  - mail.followers.create
  - bus.bus.create

forbidden_ops:
  - account.move.create            # must not create new invoice
  - account.move.unlink            # must not delete
  - account.move.button_cancel     # must not cancel
  - account.move.line.create       # must not add lines
  - account.move.line.unlink       # must not remove lines

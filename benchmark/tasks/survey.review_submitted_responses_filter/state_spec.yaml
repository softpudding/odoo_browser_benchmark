models:
  survey.survey:
    match_key:
      - title
    fields:
      - title
      - access_mode
    ignore_fields:
      - id
      - create_date
      - write_date
  survey.user_input:
    match_key:
      - email
    fields:
      - email
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - access_token

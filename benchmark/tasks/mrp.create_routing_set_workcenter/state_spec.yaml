models:
  mrp.workcenter:
    match_key:
      - name
    fields:
      - name
      - active
    ignore_fields:
      - id
      - create_date
      - write_date
  mrp.routing.workcenter:
    match_key:
      - bom_id
      - name
    fields:
      - name
      - bom_id
      - workcenter_id
      - time_cycle_manual
    ignore_fields:
      - id
      - create_date
      - write_date

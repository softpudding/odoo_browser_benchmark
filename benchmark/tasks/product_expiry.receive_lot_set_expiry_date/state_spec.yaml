models:
  stock.picking:
    match_key:
      - origin
    fields:
      - origin
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - name
      - date_done
      - scheduled_date
  stock.lot:
    match_key:
      - name
      - product_id
    fields:
      - name
      - product_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - expiration_date
      - use_date
      - removal_date
      - alert_date
      - product_expiry_alert
      - product_expiry_reminded
      - display_name
      - complete_name

models:
  blog.post:
    match_key:
      - name
    fields:
      - name
      - blog_id
      - subtitle
      - content
      - post_date
      - is_published
      - website_published
      - website_meta_title
      - website_meta_description
    ignore_fields:
      - id
      - create_date
      - write_date
      - cover_properties
      - visits
      - website_url
      - create_uid
      - write_uid

# Trace oracle for website_blog.create_post_with_cta_seo_schedule
#
# Medium: create a new blog.post with CTA content, SEO metadata,
# and scheduled publishing date. Browser client typically uses
# web_save instead of create/write.

required_ops: []

optional_ops:
  - blog.post.create
  - blog.post.write
  - blog.post.web_save
  - blog.post.read
  - blog.post.search_read
  - blog.post.web_search_read
  - blog.post.onchange
  - blog.blog.read
  - blog.blog.search_read
  - blog.blog.web_search_read
  - blog.blog.name_search
  - ir.ui.view.get_views

forbidden_ops:
  - blog.post.unlink
  - blog.blog.create
  - blog.blog.unlink

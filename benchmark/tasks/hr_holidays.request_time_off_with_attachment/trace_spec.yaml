# Trace oracle for hr_holidays.request_time_off_with_attachment.
#
# Both hr.leave creation and ir.attachment upload can land via a variety
# of RPC entry points (web_save vs create, mail_post vs direct
# ir.attachment.create). We gate on the final end state via check.py and
# keep required_ops empty so we don't punish e.g. BU's use of web_save.

required_ops: []

optional_ops:
  - hr.leave.create
  - hr.leave.web_save
  - hr.leave.write
  - hr.leave.read
  - hr.leave.search_read
  - hr.leave.web_search_read
  - hr.leave.onchange
  - hr.leave.name_search
  - hr.leave.type.search_read
  - hr.leave.type.web_search_read
  - hr.leave.type.name_search
  - hr.employee.search_read
  - hr.employee.web_search_read
  - hr.employee.read
  - ir.attachment.create
  - ir.attachment.read
  - ir.attachment.search_read
  - ir.attachment.write
  - ir.ui.view.get_views
  - mail.message.create
  - mail.thread.message_post
  - bus.bus.create
  - res.users.read
  - res.users.search_read

forbidden_ops:
  - hr.leave.unlink
  - hr.leave.action_refuse
  - hr.leave.action_cancel

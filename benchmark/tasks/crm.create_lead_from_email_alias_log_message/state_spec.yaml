models:
  crm.team:
    match_key:
      - name
    fields:
      - name
      - alias_name
    ignore_fields:
      - id
      - create_date
      - write_date
      - member_ids
      - crm_team_member_ids
      - alias_id
      - alias_defaults
      - alias_force_thread_id
      - alias_domain_id
      - alias_contact
  crm.lead:
    match_key:
      - name
    fields:
      - name
      - email_from
      - type
      - priority
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_last_stage_update
      - date_open
      - color
      - day_open
      - day_close
      - tag_ids

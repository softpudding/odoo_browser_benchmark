models:
  sale.order:
    match_key:
      - client_order_ref
    fields:
      - client_order_ref
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - name
  purchase.order:
    match_key:
      - origin
    fields:
      - origin
      - partner_id
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - name

models:
  event.track:
    match_key:
      - event_id
      - name
    fields:
      - event_id
      - name
      - partner_name
      - partner_email
      - is_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - date
      - date_end
      - stage_id
      - website_published
      - tag_ids

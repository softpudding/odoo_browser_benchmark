models:
  project.task:
    match_key:
      - name
    fields:
      - name
      - parent_id
      - project_id
      - stage_id
      - date_deadline
      - user_ids
    ignore_fields:
      - id
      - create_date
      - write_date
  project.project:
    match_key:
      - name
    fields:
      - name
    ignore_fields:
      - id
      - create_date
      - write_date
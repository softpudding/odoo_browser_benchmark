models:
  hr.job:
    match_key:
      - name
    fields:
      - name
      - is_published
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - create_uid
      - write_uid
      - message_ids
      - activity_ids
      - alias_id
      - favorite_user_ids
      - description        # validated via check.py (HTML field, noisy diffs)
      - website_description # validated via check.py
      - job_details
      - published_date
      - full_url
      - website_url
      - website_id
      - website_meta_title
      - website_meta_description
      - website_meta_keywords
      - website_meta_og_img

models:
  slide.channel:
    match_key:
      - name
    fields:
      - name
      - channel_type
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - message_ids
      - message_follower_ids
      - activity_ids
      - access_token
      - description
      - description_short
      - description_html
      - slide_ids
      - karma_gen_channel_finish
      - prerequisite_channel_ids
      - prerequisite_of_channel_ids
  slide.slide:
    match_key:
      - channel_id
      - name
    fields:
      - name
      - channel_id
      - slide_category
      - is_category
    ignore_fields:
      - id
      - create_date
      - write_date
      - sequence
      - category_id
      - completion_time
      - html_content
      - message_ids
      - message_follower_ids
      - activity_ids
      - access_token
      - website_published
      - is_published

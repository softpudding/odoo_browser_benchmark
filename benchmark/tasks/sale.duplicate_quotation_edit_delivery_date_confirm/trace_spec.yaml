# Trace oracle for sale.duplicate_quotation_edit_delivery_date_confirm
#
# Medium: duplicate a draft quotation via cog/Actions, edit the copy's
# commitment_date (Delivery Date on the Other Info tab), save, then
# Confirm. Only the duplicate should be confirmed; original stays draft.

required_ops:
  - sale.order.action_confirm

optional_ops:
  - sale.order.read
  - sale.order.write
  - sale.order.create
  - sale.order.copy
  - sale.order.web_save
  - sale.order.search_read
  - sale.order.web_search_read
  - sale.order.onchange
  - sale.order.line.read
  - sale.order.line.write
  - sale.order.line.create
  - sale.order.line.web_save
  - sale.order.line.onchange
  - product.product.read
  - product.product.search_read
  - product.template.read
  - product.template.search_read
  - res.partner.read
  - res.partner.search_read
  - ir.ui.view.get_views
  - mail.message.create
  - mail.thread.message_post

forbidden_ops:
  - sale.order.unlink
  - sale.order.line.unlink
  - sale.order.action_cancel

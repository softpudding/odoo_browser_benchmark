models:
  hr.department:
    match_key:
      - name
    fields:
      - name
      - manager_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - parent_path
      - color
      - complete_name
  hr.employee:
    match_key:
      - name
    fields:
      - name
      - department_id
      - job_id
    ignore_fields:
      - id
      - create_date
      - write_date

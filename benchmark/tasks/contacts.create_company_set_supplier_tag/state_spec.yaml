models:
  res.partner:
    match_key:
      - name
    fields:
      - name
      - is_company
      - email
      - phone
      - website
    ignore_fields:
      - id
      - create_date
      - write_date
      - active
      - category_id
      - state_id
      - country_id
      - street
      - city
      - zip

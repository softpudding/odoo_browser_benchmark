metadata:
  category: deep_ui_interaction
  difficulty_level: hard
  agent_interaction: "Open the existing Ready receipt WH/IN/BENCH-SERIAL (Bench Serial Vendor, Bench Serial Item demand=2). Open the move line's Detailed Operations popup, ensure exactly 2 move-line rows exist, enter serials SN-BENCH-A001 and SN-BENCH-A002 (one per row, quantity=1 each), save the popup, then click Validate in the header."
  checks_verify: "Picking WH/IN/BENCH-SERIAL state=='done'; exactly 2 stock.move.line rows on the Bench Serial Item move each with quantity==1 and distinct lot_ids named 'SN-BENCH-A001' and 'SN-BENCH-A002'; 2 stock.lot records for Bench Serial Item bearing those exact serial names; no backorder picking."
  failure_pattern: "Agent types both serials into a single move_line (either merging the qty=2 line or only filling SN-BENCH-A001) and Validates — leaving just one stock.lot instead of two. Also: agent forgets to Save the Detailed Operations popup before clicking Validate, so the serial entries never persist and Validate fails with 'supply a lot/serial number'."
  primary_track: true
  tier: 3

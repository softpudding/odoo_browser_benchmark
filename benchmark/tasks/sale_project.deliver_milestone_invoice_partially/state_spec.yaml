models:
  project.milestone:
    match_key:
      - project_id
      - name
    fields:
      - project_id
      - name
      - is_reached
    ignore_fields:
      - id
      - create_date
      - write_date
      - reached_date
      - __last_update

  sale.order.line:
    match_key:
      - order_id
      - name
    fields:
      - order_id
      - name
      - qty_delivered
      - qty_to_invoice
      - qty_invoiced
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update

  sale.order:
    match_key:
      - client_order_ref
    fields:
      - client_order_ref
      - state
      - invoice_status
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update

  account.move:
    match_key:
      - partner_id
      - move_type
    fields:
      - partner_id
      - move_type
      - state
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - __last_update

models:
  res.partner:
    match_key:
      - name
    fields:
      - name
      - parent_id
      - email
      - function
    ignore_fields:
      - id
      - create_date
      - write_date
      - active

  account.move:
    match_key:
      - partner_id
      - ref
    fields:
      - partner_id
      - ref
      - is_move_sent
    ignore_fields:
      - id
      - create_date
      - write_date

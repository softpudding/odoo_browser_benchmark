models:
  project.task:
    match_key:
      - name
    fields:
      - name
      - project_id
      - active
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_last_stage_update
      - stage_id
  project.project:
    match_key:
      - name
    fields:
      - name
      - active
    ignore_fields:
      - id
      - create_date
      - write_date
      - last_update_status

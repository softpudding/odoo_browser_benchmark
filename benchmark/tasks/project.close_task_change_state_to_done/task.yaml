  agent_interaction: "Open 'Bench Close Project', open the 'Review document' task, click the form-header state widget pill (currently 'In Progress'), select 'Done' from the dropdown, and save. This flips project.task.state from '01_in_progress' to '1_done' via the project_task_state_selection widget."
  checks_verify: "project.task 'Review document' on 'Bench Close Project' has state='1_done' (was '01_in_progress'); stage_id, priority, tag_ids, user_ids unchanged; exactly one task on the project; task name unchanged."
  primary_track: true
  tier: 1

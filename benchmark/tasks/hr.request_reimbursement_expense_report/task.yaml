task_id: hr.request_reimbursement_expense_report
module: hr_expense
difficulty: hard
instruction: see prompt.md
start_url: /odoo/expenses
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
  setup_script: seed.py
time_limit_sec: 420
step_limit: 220
metadata:
  category: closed_loop_cross_module
  difficulty_level: hard
  agent_interaction: "Open My Expenses, locate the seeded 'Bench Travel Expense' draft expense owned by admin's employee, then walk the full reimbursement lifecycle in Odoo 19: click Submit (goes to Submitted), then Approve (goes to Approved), then Post Journal Entries and confirm the wizard's Post Expenses button so the expense lands in Posted state with a journal entry attached."
  checks_verify: "hr.expense state == 'posted' (the Odoo 19 equivalent of the old sheet 'done' state after posting journal entries), total_amount unchanged at 150.00, product_id unchanged, employee_id unchanged (admin's employee), payment_mode='own_account', account_move_id populated and posted. No extra expenses created, no unrelated expenses deleted."
  failure_pattern: "Agent submits the expense but stops at 'Submitted' instead of continuing through Approve + Post; OR clicks Approve but doesn't navigate the Post Journal Entries modal; OR confuses itself by trying to locate the deprecated hr.expense.sheet approval chain, since Odoo 19 removed sheets and the approval now happens directly on hr.expense."
  primary_track: true
  tier: 3

models:
  hr.expense:
    match_key:
      - name
    fields:
      - name
      - state
      - approval_state
      - total_amount
      - product_id
      - employee_id
      - payment_mode
    ignore_fields:
      - id
      - create_date
      - write_date
      - currency_rate
      - approval_date
      - amount_residual
      - account_move_id
      - total_amount_currency
      - manager_id

models:
  sale.order:
    match_key:
      - name
    fields:
      - name
      - client_order_ref
      - partner_id
      - payment_term_id
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update

  sale.order.line:
    match_key:
      - order_id
      - product_id
    fields:
      - order_id
      - product_id
      - name
      - discount
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update


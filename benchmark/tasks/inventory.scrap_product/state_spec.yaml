models:
  stock.scrap:
    match_key:
      - product_id
    fields:
      - product_id
      - scrap_qty
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
  product.product:
    match_key:
      - name
    fields:
      - name
      - qty_available
    ignore_fields:
      - id
      - create_date
      - write_date
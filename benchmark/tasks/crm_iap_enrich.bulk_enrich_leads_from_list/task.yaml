task_id: crm_iap_enrich.bulk_enrich_leads_from_list
module: crm_iap_enrich
difficulty: hard
instruction: see prompt.md
start_url: /odoo/crm
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
  setup_script: seed.py
time_limit_sec: 600
step_limit: 250
metadata:
  category: deep_ui_interaction
  difficulty_level: hard
  agent_interaction: "From the CRM > Leads list view, multi-select three unenriched leads (via row checkboxes), open the Actions menu, and click the 'Enrich' server action. The action runs iap_enrich() on the three selected leads; because the seeded emails use generic providers (@gmail.com), the no-credit short-circuit path fires and each selected lead gets iap_enrich_done flipped to True plus a mail.message logged with body 'No company data found based on the email address or email address is one of an email provider'. Two distractor leads (already iap_enrich_done=True and already using a corporate-domain email) must remain untouched."
  checks_verify: "Exactly three leads (BENCH-ENRICH-001/002/003) have iap_enrich_done=True AND a mail.message body referencing 'No company data found'; two distractor leads (BENCH-ENRICH-DONE, BENCH-ENRICH-SKIP) are unchanged."
  failure_pattern: "Agents often (a) enrich via the per-record form button on a single lead instead of the multi-select list Actions menu (satisfies 1/3), (b) select the wrong subset of leads (including already-enriched ones or corporate-domain ones), (c) never switch from Kanban to List view so checkboxes never appear, or (d) confuse the 'Enrich' Action menu entry with the form-header 'Enrich' button (different code paths but same label)."
  primary_track: true
  tier: 3

models:
  website.page:
    match_key:
      - url
    fields:
      - name
      - url
      - is_published
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - view_write_date
      - view_write_uid
      - date_publish

  website.menu:
    match_key:
      - url
      - website_id
    fields:
      - name
      - url
      - website_id
      - page_id
      - parent_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - parent_path
      - sequence
      - new_window
      - is_mega_menu
      - mega_menu_content
      - mega_menu_classes
      - group_ids

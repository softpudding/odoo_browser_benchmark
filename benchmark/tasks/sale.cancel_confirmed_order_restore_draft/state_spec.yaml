models:
  sale.order:
    match_key:
      - client_order_ref
    fields:
      - partner_id
      - client_order_ref
      - state
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - date_order
      - amount_total
      - amount_untaxed
      - amount_tax
      - commitment_date
      - expected_date
      - validity_date
      - note
      - origin
      - signature
      - signed_by
      - signed_on

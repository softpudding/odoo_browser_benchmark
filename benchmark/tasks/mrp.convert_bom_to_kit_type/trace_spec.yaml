# Trace oracle for mrp.convert_bom_to_kit_type
#
# Easy: single radio/selector change on a BOM form. web_save is the main op.

required_ops: []

optional_ops:
  - mrp.bom.read
  - mrp.bom.write
  - mrp.bom.web_save
  - mrp.bom.search_read
  - mrp.bom.web_search_read
  - ir.ui.view.get_views

forbidden_ops:
  - mrp.bom.unlink
  - mrp.bom.create

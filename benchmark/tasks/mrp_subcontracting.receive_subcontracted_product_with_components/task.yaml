task_id: mrp_subcontracting.receive_subcontracted_product_with_components
module: mrp_subcontracting
difficulty: hard
instruction: see prompt.md
start_url: /odoo/inventory
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
setup_script: seed.py
time_limit_sec: 600
step_limit: 300
metadata:
  category: deep_ui_interaction
  difficulty_level: hard
  agent_interaction: "Open the vendor receipt auto-generated from confirmed PO P-BENCH-SUB-001 for serial-tracked 'Bench Sub Assembly' qty=2. Click the line's Details button to open the Detailed Operations popup, ensure two move_line rows, fill Lot/Serial = BSA-2026-01 / BSA-2026-02 (qty 1 each) via the autocomplete Create option, save, and Validate the receipt. On validation, the auto-created subcontracting mrp.production (and its lot-split siblings) becomes done and back-flushes 4 components (2x Part-A + 2x Part-B) from the subcontractor location."
  checks_verify: "Receipt state='done'; two stock.move.line rows on the receipt subcontract move with lot_ids=BSA-2026-01 and BSA-2026-02 (qty 1 each); subcontract mrp.production records for Bench Sub Assembly (subcontractor=Bench Subcontractor Inc) total product_qty=2 and are all state='done'; stock.quant for Part-A and Part-B at the subcontracting location each decreased by 2.0."
  failure_pattern: "Agent tries to Validate without opening Detailed Operations first (gets a 'Missing lot' error), or enters only one serial with quantity=2 on a single move_line (violates the 'one serial per unit' rule), or types the serials with a different naming scheme (e.g. BSA-001 vs the required BSA-2026-01)."
  primary_track: true
  tier: 3

models:
  stock.picking:
    match_key:
      - origin
      - partner_id
    fields:
      - origin
      - partner_id
      - state
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - date_done
      - scheduled_date
      - date
      - date_deadline
  stock.lot:
    match_key:
      - name
      - product_id
    fields:
      - name
      - product_id
    ignore_fields:
      - id
      - create_date
      - write_date
  mrp.production:
    match_key:
      - product_id
      - subcontractor_id
    fields:
      - product_id
      - subcontractor_id
      - state
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - date_start
      - date_finished
      - date_deadline
      - origin
      - product_qty

models:
  mail.activity:
    match_key:
      - res_id
      - activity_type_id
    fields:
      - res_id
      - activity_type_id
      - date_deadline
      - summary
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
  hr.employee:
    match_key:
      - name
    fields:
      - name
      - work_email
    ignore_fields:
      - id
      - create_date
      - write_date
models:
  website.page:
    match_key:
      - url
    fields:
      - name
      - url
      - website_meta_title
      - website_meta_description
      - website_meta_keywords
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - view_write_date
      - view_write_uid

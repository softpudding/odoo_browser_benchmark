models:
  sale.order:
    match_key:
      - partner_id
      - amount_total
    fields:
      - partner_id
      - state
      - amount_total
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - date_order
  stock.picking:
    match_key:
      - origin
      - picking_type_code
    fields:
      - origin
      - state
      - picking_type_code
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - date_done
      - scheduled_date

models:
  event.event:
    match_key:
      - name
    fields:
      - name
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
  event.registration:
    match_key:
      - name
      - email
    fields:
      - name
      - email
      - event_id
    ignore_fields:
      - id
      - create_date
      - write_date

models:
  project.task:
    match_key:
      - name
    fields:
      - name
      - active
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_last_stage_update
      # The following are validated via check.py (not as diff assertions):
      - project_id
      - stage_id
      - date_deadline
      - tag_ids
      - user_ids
      - partner_id
      - description
      - priority
      - kanban_state
      - state
      - sequence
      - color
      - display_name
      - portal_url
      - access_url
      - access_token
      - access_warning

# Trace oracle for project.create_task_with_deadline_tags_assignees.
#
# Medium: create a project.task from the project kanban with date_deadline,
# two tag_ids, and two user_ids assignees. Browser-use normally uses
# web_save for the final create, so we leave required_ops empty and validate
# the concrete outcome through check.py + expected_state.json.

required_ops: []

optional_ops:
  - project.task.create
  - project.task.web_save
  - project.task.write
  - project.task.read
  - project.task.search_read
  - project.task.web_search_read
  - project.task.onchange
  - project.task.get_views
  - project.task.name_search
  - project.tags.name_search
  - project.tags.read
  - project.tags.search_read
  - project.tags.web_search_read
  - res.users.name_search
  - res.users.read
  - res.users.search_read
  - res.users.web_search_read
  - project.project.read
  - project.project.search_read
  - project.project.web_search_read
  - project.task.type.read
  - project.task.type.search_read
  - ir.ui.view.get_views

forbidden_ops:
  - project.task.unlink
  - project.tags.unlink
  - project.tags.create
  - res.users.unlink
  - res.users.create
  - project.project.unlink
  - project.project.create

models:
  account.move:
    match_key:
      - invoice_origin
    fields:
      - invoice_origin
      - ref
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update

  res.partner:
    match_key:
      - name
    fields:
      - name
      - vat
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update


models:
  event.event:
    match_key:
      - name
    fields:
      - name
      - is_published
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - create_uid
      - write_uid
      - message_ids
      - activity_ids
      - event_ticket_ids
      - event_slot_ids
      - question_ids
      - general_question_ids
      - specific_question_ids
      - seats_available
      - seats_used
      - seats_taken
      - seats_expected
      - seats_reserved
      - seats_unconfirmed
      - published_date
      - website_url
      - menu_id
      - introduction_menu_ids
      - community_menu_ids
      - register_menu_ids

  event.registration:
    match_key:
      - name
      - email
      - event_id
    fields:
      - name
      - email
      - phone
      - state
      - event_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - create_uid
      - write_uid
      - message_ids
      - activity_ids
      - visitor_id
      - partner_id
      - event_ticket_id

models:
  crm.lead:
    match_key:
      - name
    fields:
      - name
      - type
      - expected_revenue
      - priority
    ignore_fields:
      - id
      - create_date
      - write_date
  mail.activity:
    match_key:
      - summary
    fields:
      - summary
      - date_deadline
      - res_model
    ignore_fields:
      - id
      - create_date
      - write_date

models:
  stock.picking:
    match_key:
      - origin
    fields:
      - origin
      - state
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - date_done
      - scheduled_date
      - date
  stock.lot:
    match_key:
      - name
      - product_id
    fields:
      - name
      - product_id
    ignore_fields:
      - id
      - create_date
      - write_date

task_id: stock.receive_serial_tracked_product
module: stock
difficulty: hard
instruction: see prompt.md
start_url: /odoo/inventory
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
setup_script: seed.py
time_limit_sec: 600
step_limit: 300
metadata:
  category: deep_ui_interaction
  difficulty_level: hard
  agent_interaction: "Open the draft incoming receipt for the serial-tracked product, open Detailed Operations on the move line, enter three distinct serials (one per move line, qty 1 each), close, then Validate the receipt."
  checks_verify: "The receipt reaches state='done', exactly three stock.lot records exist for 'Bench Serial Gadget' with names SN-BENCH-001/002/003, each linked to a move_line of quantity 1 on the receipt."
  failure_pattern: "Agents struggle to split a serial-tracked move into three separate move_lines (one serial per line, qty 1) via the Detailed Operations popup, and often dump all three serials onto a single line or validate without all serials assigned."
  primary_track: true
  tier: 3

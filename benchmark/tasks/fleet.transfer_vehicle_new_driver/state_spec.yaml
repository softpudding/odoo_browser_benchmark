models:
  fleet.vehicle:
    match_key:
      - license_plate
    fields:
      - license_plate
      - driver_id
      - model_id
    ignore_fields:
      - id
      - create_date
      - write_date
  fleet.vehicle.assignation.log:
    match_key:
      - vehicle_id
      - driver_id
    fields:
      - vehicle_id
      - driver_id
      - date_start
    ignore_fields:
      - id
      - create_date
      - write_date

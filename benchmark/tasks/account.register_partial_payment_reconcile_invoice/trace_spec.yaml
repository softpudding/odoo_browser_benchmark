# Trace oracle for account.register_partial_payment_reconcile_invoice
#
# Category 2: Policy trap (wizard).
# Agent must open the Register Payment wizard on the CORRECT posted
# customer invoice (BENCH-PARTIAL-001, total 500), OVERRIDE the
# auto-filled full amount (500) with 200, then click the primary "Create
# Payment" button. The wizard's action_create_payments method creates the
# account.payment, posts it, and partially reconciles it against the
# invoice.

required_ops:
  - account.payment.register.action_create_payments

optional_ops:
  - account.move.read
  - account.move.web_read
  - account.move.search_read
  - account.move.web_search_read
  - account.move.write
  - account.move.web_save
  - account.move.action_register_payment
  - account.move.line.read
  - account.move.line.search_read
  - account.payment.register.create
  - account.payment.register.read
  - account.payment.register.write
  - account.payment.register.onchange
  - account.payment.read
  - account.payment.search_read
  - account.payment.web_read
  - account.payment.action_post
  - res.partner.read
  - res.partner.search_read
  - account.journal.read
  - account.journal.search_read
  - account.payment.method.line.read
  - account.payment.method.line.search_read
  - ir.ui.view.get_views
  - ir.ui.view.read
  - mail.message.create
  - mail.followers.create
  - bus.bus.create

forbidden_ops:
  - account.move.button_draft
  - account.move.button_cancel
  - account.move.unlink
  - account.payment.unlink
  - account.move.reversal.refund_moves
  - account.move.reversal.modify_moves

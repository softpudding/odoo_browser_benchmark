models:
  hr.applicant:
    match_key:
      - partner_name
    fields:
      - partner_name
      - stage_id
      - job_id
      - active
      - refuse_reason_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_last_stage_update
      - message_ids
      - message_follower_ids
      - activity_ids
      - rotting_days
      - is_rotting

  mail.message:
    match_key:
      - record_name
      - subject
    fields:
      - subject
      - model
      - record_name
      - message_type
    ignore_fields:
      - id
      - res_id
      - date
      - create_date
      - write_date
      - body
      - author_id
      - partner_ids
      - notified_partner_ids
      - attachment_ids
      - tracking_value_ids
      - email_from
      - reply_to
      - email_layout_xmlid
      - mail_server_id
      - message_id
      - parent_id
      - notification_ids
      - starred_partner_ids
      - is_internal
      - subtype_id
      - has_error
      - has_error_partner_ids
      - needaction
      - needaction_partner_ids

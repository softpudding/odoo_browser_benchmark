models:
  blog.blog:
    match_key:
      - name
    fields:
      - name
      - active
    ignore_fields:
      - id
      - create_date
      - write_date
      - create_uid
      - write_uid
  blog.post:
    match_key:
      - name
    fields:
      - name
      - blog_id
      - active
      - is_published
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - create_uid
      - write_uid
      - post_date
      - published_date
      - tag_ids
      - content
      - subtitle
      - cover_properties
      - visits
      - website_url
      - author_id

metadata:
  category: closed_loop_cross_module
  difficulty_level: hard
  agent_interaction: "Create a new RFQ for vendor Bench Supply Co with two seeded lines (Bench PO Item A qty=10, Bench PO Item B qty=5), confirm, open the generated receipt, set Done=7 on line A (leave B=5), Validate and choose Create Backorder on the dialog, return to the PO, click Create Bill, set Bill Reference, and Confirm-post the bill."
  checks_verify: "purchase.order state='purchase' with 2 lines and qty_received=7 (line A) and qty_received=5 (line B); the original stock.picking state='done'; a backorder stock.picking exists for 3 remaining A units; one posted account.move of move_type='in_invoice' for the vendor referencing the PO."
  failure_pattern: "Agent either (a) leaves a phantom empty PO line after tabbing through the editor, (b) clicks the default 'Create Backorder' too fast without lowering Done=7 on line A (so line A becomes Done=10 with no backorder), or (c) fails to traverse Purchase → Inventory → Purchase and skips the Create Bill step entirely, leaving the PO unbilled."
  primary_track: true
  tier: 3

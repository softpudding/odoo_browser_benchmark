models:
  purchase.order:
    match_key:
      - partner_id
    fields:
      - partner_id
      - state
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - date_order
      - date_approve
      - partner_ref
  stock.picking:
    match_key:
      - partner_id
      - backorder_id
    fields:
      - partner_id
      - state
      - backorder_id
    ignore_fields:
      - id
      - name
      - origin
      - create_date
      - write_date
      - date_done
      - scheduled_date
      - date
  account.move:
    match_key:
      - partner_id
      - ref
    fields:
      - partner_id
      - ref
      - state
      - move_type
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - invoice_date
      - invoice_date_due

models:
  mrp.production:
    match_key:
      - name
    fields:
      - name
      - state
      - reservation_state
      - product_qty
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_start
      - date_finished
      - date_deadline
      - date_planned_start
      - date_planned_finished
  stock.move:
    match_key:
      - raw_material_production_id
      - product_id
    fields:
      - raw_material_production_id
      - product_id
      - state
      - product_uom_qty
    ignore_fields:
      - id
      - create_date
      - write_date
      - date
      - date_deadline
      - reference

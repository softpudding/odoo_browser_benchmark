metadata:
  category: deep_ui_interaction
  difficulty_level: medium
  failure_pattern: "Agent either misses the Unreserve button entirely (clicks Cancel/Check availability/Produce All instead), or reaches for the cog Actions menu without realising the statusbar has a direct Unreserve button, or tries to manually zero-out reserved quantities on the Components tab (which is read-only for a confirmed-not-in-progress MO), or mistakenly cancels the MO instead of releasing reservations."
  agent_interaction: "Open Manufacturing > Operations > Manufacturing Orders, open the confirmed MO-BENCH-UNRES (5 Bench Unres Product), and click the statusbar Unreserve button (name='do_unreserve'). The button is visible because unreserve_visible=True (already reserved, no picked qty). After clicking, the MO remains in state='confirmed' but its reservation_state flips from 'assigned' back to 'confirmed' and the raw move.state flips from 'assigned' to 'confirmed'. No wizard, no modal — a single click commits the change."
  checks_verify: "mrp.production 'MO-BENCH-UNRES' state stays 'confirmed' (NOT cancelled, NOT done); reservation_state becomes 'confirmed'; the single raw stock.move for Bench Unres Mat has state='confirmed' (not 'assigned'); stock.quant.reserved_quantity at WH/Stock for Bench Unres Mat is 0.0; stock.quant.quantity (on-hand) stays 10.0; no stray MOs or extra moves."
  primary_track: true
  tier: 2

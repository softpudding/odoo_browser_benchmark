models:
  product.template:
    match_key:
      - name
      - service_tracking
      - list_price
    fields:
      - name
      - type
      - list_price
      - service_tracking
    ignore_fields:
      - id
      - create_date
      - write_date
  event.event.ticket:
    match_key:
      - event_id
      - name
    fields:
      - event_id
      - name
      - price
      - seats_max
      - product_id
    ignore_fields:
      - id
      - create_date
      - write_date

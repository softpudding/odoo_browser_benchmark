# Trace oracle for stock.run_manual_replenishment_for_product
#
# Hard (deep_ui_interaction): Replenishment dashboard + per-row Order
# button (action_replenish). The per-row button on the editable list
# calls the controller method
# `stock.static/src/views/stock_orderpoint_list_controller.js#onClickOrder`
# which in turn fires `stock.warehouse.orderpoint.action_replenish` via
# ORM call_kw. The notification link points to the newly-created draft
# purchase.order.

required_ops: []

optional_ops:
  - stock.warehouse.orderpoint.action_replenish
  - stock.warehouse.orderpoint.action_replenish_auto
  - stock.warehouse.orderpoint.action_open_orderpoints
  - stock.warehouse.orderpoint.action_remove_manual_qty_to_order
  - stock.warehouse.orderpoint.read
  - stock.warehouse.orderpoint.web_read
  - stock.warehouse.orderpoint.web_search_read
  - stock.warehouse.orderpoint.search_read
  - stock.warehouse.orderpoint.write
  - stock.warehouse.orderpoint.web_save
  - stock.warehouse.orderpoint.onchange
  - purchase.order.create
  - purchase.order.write
  - purchase.order.web_save
  - purchase.order.read
  - purchase.order.web_read
  - purchase.order.search_read
  - purchase.order.web_search_read
  - purchase.order.onchange
  - purchase.order.line.create
  - purchase.order.line.write
  - purchase.order.line.web_save
  - purchase.order.line.read
  - purchase.order.line.onchange
  - product.product.read
  - product.product.search_read
  - product.product.web_read
  - product.template.read
  - product.supplierinfo.read
  - product.supplierinfo.search_read
  - stock.location.read
  - stock.location.name_search
  - stock.warehouse.read
  - stock.rule.read
  - res.partner.name_search
  - res.partner.read
  - ir.ui.view.get_views
  - mail.message.create
  - bus.bus.create

forbidden_ops:
  - stock.warehouse.orderpoint.unlink
  - purchase.order.unlink
  - purchase.order.button_cancel
  - purchase.order.line.unlink
  - product.product.write
  - product.template.write
  - product.supplierinfo.write
  - product.supplierinfo.unlink

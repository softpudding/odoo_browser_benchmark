models:
  account.move:
    match_key:
      - partner_id
      - invoice_origin
    fields:
      - partner_id
      - invoice_origin
      - ref
      - state
      - invoice_date
      - invoice_payment_term_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - name
      - payment_state

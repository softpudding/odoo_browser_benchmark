models:
  hr.employee:
    match_key:
      - name
    fields:
      - name
      - work_phone
      - work_location_id
      - job_id
      - department_id
    ignore_fields:
      - id
      - create_date
      - write_date

  mail.activity:
    match_key:
      - summary
    fields:
      - summary
      - activity_type_id
      - date_deadline
      - res_model
      - state
    ignore_fields:
      - id
      - create_date
      - write_date

# Trace oracle for mail.create_group_channel_upload_attachment
#
# Agent must create a private group Discuss channel, invite Bob, and
# upload a small text attachment via the channel composer. Validation
# is primarily through check.py since the browser composer routes
# attachment uploads through /mail/attachment/upload (not call_kw).

required_ops:
  - discuss.channel.create
  - discuss.channel.message_post

optional_ops:
  - web_save
  - ir.attachment.create
  - ir.attachment.write
  - ir.attachment.read
  - ir.attachment.search_read
  - discuss.channel.read
  - discuss.channel.search_read
  - discuss.channel.add_members
  - discuss.channel.member.create
  - discuss.channel.member.read
  - mail.message.create
  - mail.message.read
  - mail.message.search_read
  - mail.thread.message_post
  - res.users.read
  - res.users.search_read
  - res.partner.read
  - res.partner.search_read
  - ir.ui.view.get_views

forbidden_ops:
  - discuss.channel.unlink
  - discuss.channel.action_unfollow
  - ir.attachment.unlink

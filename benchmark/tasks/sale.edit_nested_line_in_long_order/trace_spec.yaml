# Trace oracle for sale.edit_nested_line_in_long_order
#
# Category 5: Deep UI interaction.
# Agent must scroll in nested o2many to find and edit a specific line.

required_ops:
  - sale.order.line.write          # edit the Footrest line
  - sale.order.action_confirm      # confirm the order

optional_ops:
  - sale.order.read
  - sale.order.web_read
  - sale.order.search_read
  - sale.order.web_search_read
  - sale.order.write
  - sale.order.web_save
  - sale.order.onchange
  - sale.order.line.read
  - sale.order.line.search_read
  - sale.order.line.onchange
  - product.product.read
  - res.partner.read
  - res.partner.search_read
  - ir.ui.view.get_views
  - ir.ui.view.read
  - account.tax.read
  - mail.message.create
  - mail.followers.create
  - bus.bus.create

forbidden_ops:
  - sale.order.create
  - sale.order.unlink
  - sale.order.action_cancel
  - sale.order.line.create         # no adding lines
  - sale.order.line.unlink         # no removing lines

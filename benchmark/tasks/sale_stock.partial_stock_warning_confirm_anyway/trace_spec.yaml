# Trace oracle for sale_stock.partial_stock_warning_confirm_anyway
#
# Hard: confirm SO with insufficient stock, override warning, validate partial
# delivery with Create Backorder.

required_ops:
  - sale.order.action_confirm
  - stock.picking.button_validate
  - stock.backorder.confirmation.process

optional_ops:
  - sale.order.read
  - sale.order.write
  - sale.order.web_save
  - sale.order.search_read
  - sale.order.web_search_read
  - sale.order.line.read
  - sale.order.line.write
  - sale.order.line.web_save
  - sale.order.line.create
  - stock.picking.read
  - stock.picking.write
  - stock.picking.web_save
  - stock.picking.search_read
  - stock.picking.web_search_read
  - stock.picking.action_confirm
  - stock.picking.action_assign
  - stock.move.read
  - stock.move.write
  - stock.move.web_save
  - stock.move.line.read
  - stock.move.line.write
  - stock.move.line.web_save
  - stock.move.line.create
  - stock.backorder.confirmation.create
  - stock.backorder.confirmation.read
  - stock.backorder.confirmation.write
  - ir.ui.view.get_views
  - mail.message.create

forbidden_ops:
  - sale.order.unlink
  - sale.order._action_cancel
  - stock.picking.unlink
  - stock.picking.action_cancel
  - stock.backorder.confirmation.process_cancel_backorder

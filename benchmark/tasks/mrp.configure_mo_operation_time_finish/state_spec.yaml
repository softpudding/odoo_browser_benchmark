models:
  mrp.workorder:
    match_key:
      - production_id
      - name
    fields:
      - name
      - state
      - duration_expected
      - production_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_start
      - date_finished
      - duration
      - duration_unit
      - duration_percent
      - leave_id
      - qty_produced
      - qty_producing
      - qty_remaining
      - qty_ready
      - progress
      - is_produced
      - barcode

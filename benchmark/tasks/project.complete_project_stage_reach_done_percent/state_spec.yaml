models:
  project.task:
    match_key:
      - name
      - project_id
    fields:
      - name
      - project_id
      - stage_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_last_stage_update
      # All below validated via check.py (not diff):
      - state
      - priority
      - date_deadline
      - tag_ids
      - user_ids
      - partner_id
      - description
      - kanban_state
      - sequence
      - color
      - active
      - display_name
      - portal_url
      - access_url
      - access_token
      - access_warning
      - is_closed
      - date_end
      - date_assign

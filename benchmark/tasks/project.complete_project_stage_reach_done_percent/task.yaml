task_id: project.complete_project_stage_reach_done_percent
module: project
difficulty: medium
instruction: see prompt.md
start_url: /odoo/project
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
setup_script: seed.py
time_limit_sec: 360
step_limit: 200
metadata:
  category: deep_ui_interaction
  difficulty_level: medium
  agent_interaction: "Open 'Bench Progress Project' kanban (grouped by stage: To Do / In Progress / Done). Three task cards Task A, Task B, Task C sit in the 'To Do' column. Drag each card from 'To Do' to 'Done' one by one (project.task has no bulk Change Stage action in Odoo 19 Community, so each card must be dragged individually). Verify all three rows have stage_id.name='Done'."
  checks_verify: "All three project.task rows (Task A, Task B, Task C) on 'Bench Progress Project' have stage_id.name='Done'; the three kanban stages ('To Do', 'In Progress', 'Done') are still linked to the project; no tasks were created or deleted."
  failure_pattern: "Agent drags only one or two cards then declares success (partial completion); or clicks the task-form state widget (sets project.task.state='1_done' but leaves stage_id='To Do', which we explicitly don't want); or uses the cog Action menu looking for a non-existent 'Change Stage' bulk action."
  primary_track: true
  tier: 2

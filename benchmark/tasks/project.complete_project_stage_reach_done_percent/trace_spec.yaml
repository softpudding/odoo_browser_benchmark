# Trace oracle for project.complete_project_stage_reach_done_percent.
#
# Medium: three kanban drags moving project.task stage_id from 'To Do'
# to 'Done'. Odoo's kanban uses web_save on stage_id (and resequence for
# card order within a column). We leave required_ops empty and rely on
# check.py + expected_state.json for outcome validation.

required_ops: []

optional_ops:
  - project.task.read
  - project.task.write
  - project.task.web_save
  - project.task.resequence
  - project.task.web_read
  - project.task.search_read
  - project.task.web_search_read
  - project.task.web_read_group
  - project.task.onchange
  - project.task.get_views
  - project.task.name_search
  - project.project.read
  - project.project.search_read
  - project.project.web_search_read
  - project.task.type.read
  - project.task.type.search_read
  - project.task.type.web_search_read
  - res.users.read
  - res.users.search_read
  - res.users.web_search_read
  - ir.ui.view.get_views
  - mail.message.create

forbidden_ops:
  - project.task.unlink
  - project.task.create
  - project.task.copy
  - project.task.toggle_active
  - project.project.unlink
  - project.project.create
  - project.task.type.unlink
  - project.task.type.create

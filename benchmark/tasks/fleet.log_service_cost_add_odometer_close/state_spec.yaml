models:
  fleet.vehicle.log.services:
    match_key:
      - vehicle_id
      - service_type_id
    fields:
      - vehicle_id
      - service_type_id
      - amount
      - date
      - vendor_id
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - odometer_id
      - purchaser_id
      - manager_id
      - model_id
      - brand_id

  fleet.vehicle.odometer:
    match_key:
      - vehicle_id
      - value
    fields:
      - vehicle_id
      - value
    ignore_fields:
      - id
      - create_date
      - write_date
      - date
      - name
      - driver_id

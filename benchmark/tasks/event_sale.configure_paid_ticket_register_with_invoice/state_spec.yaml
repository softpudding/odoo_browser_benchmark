models:
  event.event.ticket:
    match_key:
      - event_id
      - name
    fields:
      - event_id
      - name
      - price
      - seats_max
      - product_id
    ignore_fields:
      - id
      - create_date
      - write_date
  event.registration:
    match_key:
      - name
      - email
    fields:
      - name
      - email
      - state
      - event_id
      - event_ticket_id
      - sale_order_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - barcode
  sale.order:
    match_key:
      - partner_id
    fields:
      - partner_id
      - state
      - amount_total
    ignore_fields:
      - id
      - create_date
      - write_date
      - name
      - date_order
  account.move:
    match_key:
      - partner_id
      - move_type
    fields:
      - partner_id
      - move_type
      - state
      - amount_total
    ignore_fields:
      - id
      - create_date
      - write_date
      - name
      - invoice_date

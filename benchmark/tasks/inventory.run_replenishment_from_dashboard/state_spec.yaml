models:
  purchase.order:
    match_key:
      - partner_id
    fields:
      - partner_id
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - name
      - date_order
      - date_planned
      - date_approve
      - amount_total
      - amount_untaxed
      - amount_tax
      - origin

  purchase.order.line:
    match_key:
      - product_id
    fields:
      - product_id
      - product_qty
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_planned
      - name
      - order_id
      - price_unit

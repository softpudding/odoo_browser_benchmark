# Trace oracle for purchase.reset_draft_edit_reconfirm
#
# Category 4: Recovery and rollback (EASY).
# Agent must reset a confirmed PO to draft, edit the notes field, and re-confirm.

required_ops:
  - purchase.order.button_confirm    # Must re-confirm after editing

optional_ops:
  - purchase.order.read
  - purchase.order.write
  - purchase.order.web_save
  - purchase.order.search_read
  - purchase.order.web_search_read
  - purchase.order.onchange
  - purchase.order.line.read
  - purchase.order.line.search_read
  - product.product.read
  - product.product.search_read
  - res.partner.read
  - res.partner.search_read
  - ir.ui.view.get_views
  - ir.ui.view.read
  - mail.message.create
  - mail.followers.create
  - bus.bus.create

forbidden_ops:
  - purchase.order.unlink            # Must not delete the PO

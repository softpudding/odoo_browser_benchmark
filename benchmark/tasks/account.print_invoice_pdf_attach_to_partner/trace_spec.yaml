# Trace oracle for account.print_invoice_pdf_attach_to_partner.
#
# Hard deep_ui_interaction: posted out_invoice -> header Send -> Send &
# Print wizard -> tick 'by Print' -> primary Send. Wizard posts a
# mail.message with a PDF attachment on the invoice.

required_ops: []

optional_ops:
  - account.move.read
  - account.move.web_read
  - account.move.search_read
  - account.move.web_search_read
  - account.move.write
  - account.move.web_save
  - account.move.action_invoice_sent
  - account.move.action_print_pdf
  - account.move.line.read
  - account.move.line.search_read
  - account.move.send.wizard.create
  - account.move.send.wizard.read
  - account.move.send.wizard.web_read
  - account.move.send.wizard.web_save
  - account.move.send.wizard.write
  - account.move.send.wizard.action_send_and_print
  - mail.template.read
  - mail.template.search_read
  - res.partner.read
  - res.partner.search_read
  - ir.ui.view.get_views
  - ir.ui.view.read
  - mail.message.create
  - mail.followers.create
  - bus.bus.create
  - ir.attachment.create
  - ir.attachment.read

forbidden_ops:
  - account.move.button_draft
  - account.move.button_cancel
  - account.move.unlink
  - account.move.action_reverse

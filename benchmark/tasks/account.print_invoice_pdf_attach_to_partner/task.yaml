metadata:
  category: deep_ui_interaction
  difficulty_level: hard
  tier: 3
  primary_track: true
  failure_pattern: "Agent posts the invoice or opens Send, but fails to enable the Print checkbox in the Send & Print wizard so the PDF is never attached to the chatter; or clicks Discard; or only downloads the PDF via the header Print button without producing a chatter attachment."
  agent_interaction: "Open a POSTED customer invoice (BENCH-PRINT-001 / Bench Print Co), click the header Send button, in the account.move.send.wizard ensure both the Email AND the Print sending-method checkboxes are checked, then click the primary Send button in the wizard footer. The Send flow must produce a mail.message on the invoice carrying a PDF attachment (filename ending .pdf, mimetype application/pdf)."
  checks_verify: "A mail.message is posted on account.move(ref='BENCH-PRINT-001') with at least one ir.attachment whose name ends with '.pdf' or mimetype='application/pdf'. The invoice remains posted, amount 150.00 unchanged, partner Bench Print Co unchanged."

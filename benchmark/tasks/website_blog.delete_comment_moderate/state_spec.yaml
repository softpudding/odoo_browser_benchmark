models:
  blog.post:
    match_key:
      - name
    fields:
      - name
      - blog_id
      - author_id
      - is_published
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - post_date
      - published_date
      - tag_ids
      - content
      - subtitle
      - cover_properties
      - visits
      - website_url
      - write_uid
      - create_uid
      - message_ids
      - website_message_ids
      - message_follower_ids
      - message_partner_ids
      - message_has_error
      - message_has_error_counter
      - message_needaction
      - message_needaction_counter
      - message_unread
      - message_unread_counter
      - message_attachment_count
      - activity_ids

task_id: hr_recruitment.hire_candidate_refuse_another
module: hr_recruitment
difficulty: hard
instruction: see prompt.md
start_url: /odoo/recruitment
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
setup_script: seed.py
time_limit_sec: 600

metadata:
  category: policy_trap_wizard
  difficulty_level: hard
  agent_interaction: "Hire the Top Candidate (advance stage to Contract Signed, then click Create Employee) then open the Runner Up and Refuse them with the 'Not a fit' reason in the refuse-reason wizard."

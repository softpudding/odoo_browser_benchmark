models:
  mail.message:
    match_key:
      - res_id
      - subtype_id
    fields:
      - res_id
      - subtype_id
      - body
      - message_type
    ignore_fields:
      - id
      - create_date
      - write_date
  sale.order:
    match_key:
      - partner_id
      - client_order_ref
    fields:
      - partner_id
      - client_order_ref
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
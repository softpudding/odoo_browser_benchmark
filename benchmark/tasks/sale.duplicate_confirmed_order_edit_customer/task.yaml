  checks_verify: "Exactly 2 sale.order rows exist: the original (client_order_ref='BENCH-DUP', partner_id=Bench Orig Co, state='sale', lines unchanged) plus a new draft copy (client_order_ref=False because sale.order.client_order_ref has copy=False, partner_id=Bench Clone Co, state='draft') with its two order lines copied from the source."
  failure_pattern: "Agent may (a) cancel/reset the original instead of duplicating, (b) confirm the copy (forbidden — copy must stay draft), (c) only change the delivery address rather than the Customer field, or (d) click Duplicate repeatedly because the copy still displays the original customer in the breadcrumb before the agent finishes editing."

models:
  project.project:
    match_key:
      - name
    fields:
      - name
    ignore_fields:
      - id
      - create_date
      - write_date
  project.task:
    match_key:
      - name
      - project_id
    fields:
      - name
      - project_id
    ignore_fields:
      - id
      - create_date
      - write_date

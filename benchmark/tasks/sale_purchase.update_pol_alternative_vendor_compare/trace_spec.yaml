# Category 2 (HARD): policy/wizard trap.  Agent must:
#   - call action_create_alternative twice (Create Alternative button)
#   - call action_compare_alternative_lines (Compare Product Lines button)
#   - call action_choose / action_clear_quantities to zero rivals
#   - confirm Beacon's RFQ via the alternative warning wizard

models:
  purchase.order:
    match_key:
      - origin
    fields:
      - origin
      - receipt_status
    ignore_fields:
      - id
      - create_date
      - write_date
      - name
      - partner_id
  stock.scrap:
    match_key:
      - product_id
    fields:
      - product_id
      - scrap_qty
      - state
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - date_done
      - origin
      - picking_id

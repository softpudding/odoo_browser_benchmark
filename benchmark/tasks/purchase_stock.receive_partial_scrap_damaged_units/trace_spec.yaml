# Trace oracle for purchase_stock.receive_partial_scrap_damaged_units.
#
# HARD: open the PO's incoming receipt, scrap 2 Bench Widget units (reason
# tag 'Damaged') via the Actions menu, set the receipt done qty to 8, then
# validate and pick 'No Backorder' in the wizard.

required_ops:
  - stock.scrap.action_validate
  - stock.picking.button_validate
  - stock.backorder.confirmation.process_cancel_backorder

optional_ops:
  - purchase.order.read
  - purchase.order.web_read
  - purchase.order.search_read
  - purchase.order.web_search_read
  - purchase.order.line.read
  - stock.picking.read
  - stock.picking.web_read
  - stock.picking.search_read
  - stock.picking.web_search_read
  - stock.picking.action_confirm
  - stock.picking.action_assign
  - stock.picking.button_scrap
  - stock.move.read
  - stock.move.write
  - stock.move.search_read
  - stock.move.line.read
  - stock.move.line.write
  - stock.move.line.create
  - stock.move.line.search_read
  - stock.scrap.create
  - stock.scrap.write
  - stock.scrap.web_save
  - stock.scrap.read
  - stock.scrap.search_read
  - stock.scrap.onchange
  - stock.scrap.do_scrap
  - stock.scrap.reason.tag.name_create
  - stock.scrap.reason.tag.read
  - stock.scrap.reason.tag.search_read
  - stock.scrap.reason.tag.name_search
  - stock.backorder.confirmation.create
  - stock.backorder.confirmation.write
  - stock.backorder.confirmation.read
  - stock.picking.write
  - product.product.read
  - res.partner.read
  - ir.ui.view.get_views
  - ir.ui.view.read
  - ir.actions.server.run
  - mail.message.create
  - mail.followers.create
  - bus.bus.create

forbidden_ops:
  - purchase.order.button_cancel
  - purchase.order.unlink
  - purchase.order.create
  - purchase.order.line.create
  - purchase.order.line.unlink
  - stock.picking.action_cancel
  - stock.picking.unlink
  - stock.scrap.unlink
  - stock.scrap.action_set_draft
  - stock.backorder.confirmation.process

task_id: sale_management.create_quotation_template_apply_to_new_so
module: sale_management
difficulty: medium
instruction: see prompt.md
start_url: /odoo/sales
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
setup_script: seed.py
time_limit_sec: 360
step_limit: 200
metadata:
  category: deep_ui_interaction
  difficulty_level: medium
  agent_interaction: "Create a sale.order.template named 'Bench Starter Pack' with two product lines (Bench Widget x5, Bench Gadget x2) via Sales > Configuration > Quotation Templates > New, save it, then create a new SO for 'Bench Test Co' and pick the template so the two lines auto-populate. Save as draft quotation."
  checks_verify: "sale.order.template 'Bench Starter Pack' exists with 2 lines (Widget qty=5, Gadget qty=2) and a new sale.order for 'Bench Test Co' has sale_order_template_id set to the template with two matching order_line rows, state=draft."
  failure_pattern: "Agent may miss the Configuration submenu (Quotation Templates is gated by the group_sale_order_template setting), fumble the sale_order_template_id m2o on the SO form, or confirm the SO instead of leaving it as a draft quotation."
  primary_track: true
  tier: 2

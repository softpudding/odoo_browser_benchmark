models:
  res.partner:
    match_key:
      - name
    fields:
      - name
      - is_company
      - phone
      - website
      - street
      - city
      - state_id
      - zip
      - country_id
      - category_id
      - parent_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update

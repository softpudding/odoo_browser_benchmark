models:
  mrp.production:
    match_key:
      - name
    fields:
      - name
      - state
      - product_qty
      - qty_produced
      - backorder_sequence
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_start
      - date_finished
      - date_deadline
      - date_planned_start
      - date_planned_finished

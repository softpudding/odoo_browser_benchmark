models:
  stock.picking:
    match_key:
      - origin
    fields:
      - origin
      - partner_id
      - state
      - return_id
    ignore_fields:
      - id
      - name
      - create_date
      - write_date
      - date_done
      - scheduled_date
  account.move:
    match_key:
      - ref
    fields:
      - ref
      - move_type
      - state
      - amount_total
      - partner_id
      - invoice_date
    ignore_fields:
      - id
      - name
      - create_date
      - write_date

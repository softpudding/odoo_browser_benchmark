models:
  survey.survey:
    match_key:
      - title
    fields:
      - title
      - active
      - access_mode
      - users_login_required
    ignore_fields:
      - id
      - create_date
      - write_date
      - access_token
  survey.user_input:
    match_key:
      - email
    fields:
      - email
      - state
    ignore_fields:
      - id
      - create_date
      - write_date
      - start_datetime
      - end_datetime
      - access_token
      - deadline
      - invite_token
      - last_displayed_page_id
      - survey_id
      - partner_id

models:
  crm.lead:
    optional: true
    match_key:
      - name
    fields:
      - name
      - active
      - lost_reason_id
    ignore_fields:
      - id

  crm.lost.reason:
    match_key:
      - name
    fields:
      - name
      - active
    ignore_fields:
      - id
      - create_date
      - write_date

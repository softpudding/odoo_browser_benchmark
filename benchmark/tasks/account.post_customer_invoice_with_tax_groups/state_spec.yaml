models:
  account.move:
    match_key:
      - partner_id
      - move_type
    fields:
      - partner_id
      - move_type
      - state
      - amount_untaxed
      - amount_tax
      - amount_total
      - invoice_date
    ignore_fields:
      - id
      - create_date
      - write_date
      - name
      - ref
      - __last_update
      - payment_state
      - is_move_sent

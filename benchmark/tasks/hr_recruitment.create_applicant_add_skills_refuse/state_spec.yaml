models:
  hr.applicant:
    match_key:
      - partner_name
    fields:
      - partner_name
      - email_from
      - partner_phone
      - job_id
      - stage_id
      - active
      - refuse_reason_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_last_stage_update
      - priority
      - refuse_date
  hr.applicant.skill:
    match_key:
      - applicant_id
      - skill_id
    fields:
      - applicant_id
      - skill_id
      - skill_type_id
      - skill_level_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - level_progress

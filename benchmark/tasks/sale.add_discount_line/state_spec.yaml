models:
  sale.order:
    match_key:
      - client_order_ref
    fields:
      - client_order_ref
      - partner_id
      - state
      - user_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - name
  sale.order.line:
    match_key:
      - product_id
    fields:
      - product_id
      - discount
    ignore_fields:
      - id
      - create_date
      - write_date

models:
  res.partner:
    match_key:
      - name
    fields:
      - name
      - is_company
      - parent_id
      - phone
      - email
      - function
      - street
      - city
      - zip
      - country_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - active
      - website

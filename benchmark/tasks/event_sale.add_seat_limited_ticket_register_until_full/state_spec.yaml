models:
  event.event.ticket:
    match_key:
      - event_id
      - name
    fields:
      - event_id
      - name
      - price
      - seats_max
    ignore_fields:
      - id
      - create_date
      - write_date
      - product_id
  event.registration:
    match_key:
      - event_id
      - name
    fields:
      - event_id
      - name
      - state
      - event_ticket_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - barcode
      - email
      - phone

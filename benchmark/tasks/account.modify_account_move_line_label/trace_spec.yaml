# Trace oracle for account.modify_account_move_line_label
#
# Medium recovery_rollback: Reset to Draft -> edit line label -> Confirm.
# The agent MUST click Reset to Draft first (button_draft), edit the line
# name, then re-post (action_post).

required_ops:
  - account.move.button_draft      # Must reset the posted invoice to draft
  - account.move.action_post       # Must repost after editing

optional_ops:
  - account.move.read
  - account.move.web_read
  - account.move.search_read
  - account.move.web_search_read
  - account.move.write
  - account.move.web_save
  - account.move.line.read
  - account.move.line.search_read
  - account.move.line.write
  - account.move.line.web_save
  - account.move.line.onchange
  - account.move.onchange
  - product.product.read
  - product.product.search_read
  - res.partner.read
  - res.partner.search_read
  - ir.ui.view.get_views
  - ir.ui.view.read
  - mail.message.create
  - mail.followers.create
  - bus.bus.create

forbidden_ops:
  - account.move.button_cancel     # Must not cancel the invoice
  - account.move.unlink            # Must not delete the invoice
  - account.move.line.unlink       # Must not delete the line

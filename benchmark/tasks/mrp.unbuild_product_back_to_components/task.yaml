task_id: mrp.unbuild_product_back_to_components
module: mrp
difficulty: hard
instruction: see prompt.md
start_url: /odoo/manufacturing
login_context:
  login: admin
agent_interface: browser_only
db_seed:
  snapshot: benchmark_base
setup_script: seed.py
time_limit_sec: 600

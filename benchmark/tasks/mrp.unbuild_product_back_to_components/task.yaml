metadata:
  category: recovery_rollback
  difficulty_level: hard
  failure_pattern: "Agent can't find the Unbuild Orders entry point (nested under Products in the Manufacturing app, not under Operations) and either tries to create a new MO with a negative quantity, or opens a 'direct unbuild' form but mis-selects a Manufacturing Order rather than leaving it blank for a product-driven unbuild."
  agent_interaction: "Navigate Manufacturing > Products > Unbuild Orders, click New on the empty list, set Product='Bench Assembly' (BoM auto-fills), Quantity=2, leave Source Location and Destination Location at defaults (WH/Stock), then click the statusbar Unbuild button. The unbuild runs without a linked Manufacturing Order (mo_id is left blank)."
  checks_verify: "Exactly one mrp.unbuild record with mo_id=False, product=Bench Assembly, product_qty=2, state='done'; stock.quant deltas at WH/Stock: -2 Bench Assembly, +6 Bench Screw, +2 Bench Housing; no extra MOs or unbuilds created."
  primary_track: true
  tier: 3

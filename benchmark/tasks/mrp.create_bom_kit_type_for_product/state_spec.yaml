models:
  mrp.bom:
    match_key:
      - product_tmpl_id
    fields:
      - product_tmpl_id
      - type
      - product_qty
    ignore_fields:
      - id
      - create_date
      - write_date
      - code
  mrp.bom.line:
    match_key:
      - bom_id
      - product_id
    fields:
      - bom_id
      - product_id
      - product_qty
    ignore_fields:
      - id
      - create_date
      - write_date

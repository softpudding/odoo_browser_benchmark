      - name
    fields:
      - name
      - partner_id
      - type
      - expected_revenue
    ignore_fields:
      - id
      - create_date
      - write_date
      - date_last_stage_update
      - date_conversion
      - quotation_count
      - sale_order_count
      - sale_amount_total
      - order_ids
      - probability

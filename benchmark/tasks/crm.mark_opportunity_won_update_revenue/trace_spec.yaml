# Trace oracle for crm.mark_opportunity_won_update_revenue
#
# Medium: update a field on one opportunity and mark it won via the
# status-bar Won action.

required_ops:
  - crm.lead.action_set_won_rainbowman

optional_ops:
  - crm.lead.read
  - crm.lead.write
  - crm.lead.web_save
  - crm.lead.search_read
  - crm.lead.web_search_read
  - crm.lead.action_set_won
  - ir.ui.view.get_views

forbidden_ops:
  - crm.lead.unlink
  - crm.lead.action_set_lost
  - crm.lead.action_archive

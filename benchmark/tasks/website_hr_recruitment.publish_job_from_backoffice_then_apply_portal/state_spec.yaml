models:
  hr.job:
    match_key:
      - name
    fields:
      - name
      - department_id
      - no_of_recruitment
      - is_published
      - website_published
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - create_uid
      - write_uid
      - message_ids
      - activity_ids
      - alias_id
      - favorite_user_ids
      - description
      - website_description
      - job_details
      - published_date
      - full_url
      - website_url

  hr.applicant:
    match_key:
      - partner_name
      - email_from
      - job_id
    fields:
      - partner_name
      - email_from
      - partner_phone
      - linkedin_profile
      - job_id
    ignore_fields:
      - id
      - create_date
      - write_date
      - __last_update
      - create_uid
      - write_uid
      - message_ids
      - activity_ids

models:
  fleet.vehicle:
    match_key:
      - name
    fields:
      - name
      - license_plate
      - model_id
      - driver_id
      - odometer
    ignore_fields:
      - id
      - create_date
      - write_date
  fleet.vehicle.odometer:
    match_key:
      - vehicle_id
      - value
    fields:
      - vehicle_id
      - value
    ignore_fields:
      - id
      - create_date
      - write_date
